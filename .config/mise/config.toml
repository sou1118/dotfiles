[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tools]
codex = "0.164.0"
ghq = "1.11.2"
claude-code = "2.1.310"
gh = "2.103.2"
neovim = "0.12.6"
bat = "0.26.1"
fd = "10.5.0"
lsd = "1.2.0"
bottom = "0.14.9"
starship = "1.27.0"
zellij = "0.45.1"
rclone = "1.75.2"
jq = "1.8.2"
lima = "2.2.1"
1password = "2.41.1"

[bootstrap.packages]
"brew:git" = "latest"
"brew:vim" = "latest"
"brew:wget" = "latest"
"brew:tree" = "latest"
"brew:nmap" = "latest"
"brew:qemu" = "latest"
"brew:tailscale" = "latest"
"brew:inetutils" = "latest"
"brew:ffmpeg" = "latest"
"brew:llvm" = "latest"
"brew:dfu-util" = "latest"
"brew:pdftk-java" = "latest"
"brew:tokei" = "latest"

"brew-cask:adobe-acrobat-reader" = "latest"
"brew-cask:anki" = "latest"
"brew-cask:arduino-ide" = "latest"
"brew-cask:balenaetcher" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:cloudflare-warp" = "latest"
"brew-cask:deskpad" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:firefox" = "latest"
"brew-cask:firefox@developer-edition" = "latest"
"brew-cask:firefox@nightly" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:google-drive" = "latest"
"brew-cask:jetbrains-toolbox" = "latest"
"brew-cask:linearmouse" = "latest"
"brew-cask:microsoft-edge" = "latest"
"brew-cask:monitorcontrol" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:obs" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:session-manager-plugin" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:thorium" = "latest"
"brew-cask:utm" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:wezterm" = "latest"
"brew-cask:wireshark" = "latest"
"brew-cask:xquartz" = "latest"
"brew-cask:zap" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:zotero" = "latest"

[dotfiles]
"~/.zshenv" = { source = "~/ghq/github.com/sou1118/dotfiles/.zshenv" }
"~/.zshrc" = { source = "~/ghq/github.com/sou1118/dotfiles/.zshrc" }
"~/.config/git/ignore" = { source = "~/ghq/github.com/sou1118/dotfiles/.config/git/ignore" }

# 非対話シェル用（.zshrc 側は自前で activate）
[bootstrap.mise_shell_activate]
zprofile = { enabled = true, mode = "shims" }

[bootstrap.macos.dock]
autohide = true
show_recents = false

[bootstrap.macos.finder]
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true }
"com.apple.finder" = { AppleShowAllExtensions = true }

# Touch ID で sudo
[bootstrap.files."/etc/pam.d/sudo_local"]
content = """
auth       sufficient     pam_tid.so
"""
owner = "root"
group = "wheel"
mode = "0444"
