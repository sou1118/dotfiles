[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tools]
codex = "0.164.0"
ghq = "1.11.2"
claude-code = "2.1.310"
gh = "2.103.2"
neovim = "0.12.6"
bat = "0.26.1"
fd = "10.5.0"
lsd = "1.2.0"
bottom = "0.14.9"
starship = "1.27.0"
zellij = "0.45.1"
rclone = "1.75.2"
jq = "1.8.2"
lima = "2.2.1"
fzf = "0.74.5"
ripgrep = "15.2.0"
fastfetch = "2.70.0"

[dotfiles]
"~/.zshenv" = { source = "~/ghq/github.com/sou1118/dotfiles/.zshenv" }
"~/.zshrc" = { source = "~/ghq/github.com/sou1118/dotfiles/.zshrc" }
"~/.config/git/ignore" = { source = "~/ghq/github.com/sou1118/dotfiles/.config/git/ignore" }

# 非対話シェル用（.zshrc 側は自前で activate）
[bootstrap.mise_shell_activate]
zprofile = { enabled = true, mode = "shims" }
